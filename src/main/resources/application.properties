spring.application.name=consultation-backend
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jackson.default-property-inclusion=non_null

# ---------- Mail (SMTP) ----------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.from-name=${MAIL_FROM_NAME:Dr. Shweta Shete}
app.mail.doctor-bcc=${MAIL_DOCTOR_BCC:}
app.mail.reply-to=${MAIL_REPLY_TO:}
app.mail.contact-to=${CONTACT_TO_EMAIL:}

# ---------- CORS ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://shwetashete.pages.dev}

# ---------- Consultation ----------
app.consultation.duration-minutes=${CONSULT_DURATION_MIN:30}
app.consultation.slots=${CONSULT_SLOTS:10:00,10:30,11:00,11:30,12:00,12:30,16:00,16:30,17:00,17:30,18:00}
app.consultation.max-days-ahead=${CONSULT_MAX_DAYS:90}

# ---------- Reminder ----------
app.reminder.minutes-before=${REMINDER_MINUTES:10}

# ---------- Google Calendar / Meet ----------
app.google.enabled=${GOOGLE_ENABLED:false}
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.google.refresh-token=${GOOGLE_REFRESH_TOKEN:}
app.google.calendar-id=${GOOGLE_CALENDAR_ID:primary}
app.google.send-invites=${GOOGLE_SEND_INVITES:false}
app.google.doctor-email=${GOOGLE_DOCTOR_EMAIL:}

# ---------- WhatsApp Cloud API ----------
app.whatsapp.enabled=${WHATSAPP_ENABLED:false}
app.whatsapp.phone-id=${WHATSAPP_PHONE_ID:}
app.whatsapp.token=${WHATSAPP_TOKEN:}
app.whatsapp.api-version=${WHATSAPP_API_VERSION:v20.0}
app.whatsapp.language-code=${WHATSAPP_LANG:en}
app.whatsapp.confirmation-template=${WHATSAPP_CONFIRM_TEMPLATE:consultation_confirmation}
app.whatsapp.reminder-template=${WHATSAPP_REMINDER_TEMPLATE:consultation_reminder}
